spring.application.name=url-shortener
# Conexão com o Postgres no Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/url_db
spring.datasource.username=postgres
spring.datasource.password=password

# Hibernate: Cria/Atualiza as tabelas automaticamente baseado na sua @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.base-url=http://localhost:8080